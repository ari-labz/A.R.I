<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>ARI Server Installer</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="app">
        <div id="header">
            <img id="logo" src="../assets/icon.png" alt="ARI" />
            <div id="wordmark">A·R·I</div>
            <div id="subtitle">Server Installer</div>
        </div>

        <!-- Token screen -->
        <div id="screen-token" class="screen hidden">
            <p id="token-message">A GitHub personal access token is required to download ARI.</p>
            <input id="token-input" type="password" placeholder="Paste token here…" spellcheck="false" />
            <button id="btn-save-token">Continue</button>
            <a id="token-help" href="#">How do I get a token?</a>
        </div>

        <!-- Main screen -->
        <div id="screen-main" class="screen hidden">
            <div id="installed-box">
                <div class="box-label">Installed</div>
                <div id="installed-line">Checking…</div>
            </div>

            <div id="action-row">
                <button id="btn-update-latest">Update to latest</button>
                <button id="btn-select-version" class="secondary">Select version</button>
            </div>

            <div id="version-list" class="hidden"></div>

            <div id="selected-line" class="hidden"></div>

            <div id="toggles">
                <label class="toggle"><input type="checkbox" id="toggle-shortcut" checked /> <span id="toggle-shortcut-label">Add to Applications</span></label>
                <label class="toggle"><input type="checkbox" id="toggle-start" checked /> Start server after install</label>
            </div>

            <button id="btn-install" class="hidden">Install</button>
        </div>

        <!-- Progress screen -->
        <div id="screen-progress" class="screen hidden">
            <div id="status-text">Working…</div>
            <div id="progress-wrap"><div id="progress-bar"></div></div>
            <div id="progress-label"></div>
        </div>

        <!-- Done screen -->
        <div id="screen-done" class="screen hidden">
            <div id="done-text"></div>
            <button id="btn-launch">Start server</button>
            <button id="btn-close" class="secondary">Close</button>
        </div>

        <!-- Error screen -->
        <div id="screen-error" class="screen hidden">
            <svg id="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <div id="error-text"></div>
            <button id="btn-retry">Retry</button>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
