services:
  trilium:
    image: zadam/trilium:latest
    ports:
      - "8080:8080"
    volumes:
      - /Users/user/Documents/GitHub/A.R.I/Brain:/home/user/.local/share/trilium-data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./External/Ollama/models:/root/.ollama
    restart: unless-stopped
