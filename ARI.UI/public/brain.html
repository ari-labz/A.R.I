<script type="module">
import * as THREE from "/js/three.module.min.js";
THREE.ColorManagement.enabled = false;   // the look was tuned without colour management; keep it identical
const fail = msg => { document.body.insertAdjacentHTML("beforeend", `<div style="position:fixed;inset:0;display:grid;place-items:center;font:15px Inter,system-ui,sans-serif;color:#a49cc9">${msg}</div>`); throw new Error(msg); };
const res = await fetch("/api/v1/admin/brain/graph");
if (res.status === 401) { location.href = "/"; fail("Signing in…"); }
if (res.status === 403) fail("The Brain page is for admins only.");
if (!res.ok) fail("The brain isn't available right now.");
window.BRAIN = await res.json();
if (!window.BRAIN.nodes.length) fail("The brain is empty: nothing has been remembered yet.");

const rndDir = v => { const u = Math.random() * 2 - 1, t = Math.random() * 6.283, s = Math.sqrt(1 - u * u); return v.set(s * Math.cos(t), u, s * Math.sin(t)); };
const { nodes, links } = window.BRAIN;
const N = nodes.length, L = links.length;
const la = new Int32Array(L), lb = new Int32Array(L); links.forEach(([a, b], k) => { la[k] = a; lb[k] = b; });
const nb = nodes.map(() => []); for (let k = 0; k < L; k++) { nb[la[k]].push(lb[k]); nb[lb[k]].push(la[k]); }
const deg = nb.map(x => x.length);
// bridges: notes that were heavily linked in the real brain (counting only links between real notes)
const realDeg = new Int32Array(N); for (let k = 0; k < L; k++) if (nodes[la[k]].real && nodes[lb[k]].real) { realDeg[la[k]]++; realDeg[lb[k]]++; }
const isLog = n => n.type === "discussion" || n.folder === "Conversations";   // day logs link everything said that day: they should not glue subjects together
const bridge = new Set(nodes.map((_, i) => i).filter(i => realDeg[i] >= 8 && !nodes[i].group));   // a group's own note is its anchor, never a bridge; day logs are ordinary notes (in a big brain they are the chains between galaxies)

// neighbourhoods by label propagation (bridges left out so they don't merge everything)
const comm = new Int32Array(N).map((_, i) => i);
const order = [...Array(N).keys()];
for (let it = 0; it < 15; it++) {
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  let changed = 0;
  for (const i of order) { if (!deg[i] || bridge.has(i) || nodes[i].group) continue; const c = new Map();   // a group's note keeps its own label: it is the seed its members gather round
    for (const j of nb[i]) if (!bridge.has(j)) c.set(comm[j], (c.get(comm[j]) || 0) + (nodes[j].group ? 4 : 1));   // belonging to a group outweighs a passing link
    let best = comm[i], bv = -1; c.forEach((v, k) => { if (v > bv || (v === bv && k < best)) { bv = v; best = k; } });
    if (best !== comm[i]) { comm[i] = best; changed++; } }
  if (changed < N * 0.002) break;
}
// a brain that names its groups is grouped by them: a note's neighbourhood is its first group, and a group's own note is that neighbourhood's centre
if (nodes.some(n => n.groups && n.groups.length)) for (let i = 0; i < N; i++) { if (nodes[i].group) comm[i] = i; else if (nodes[i].groups && nodes[i].groups.length) comm[i] = nodes[i].groups[0]; }
const gm = new Map(); for (let i = 0; i < N; i++) if (deg[i] && !bridge.has(i)) { if (!gm.has(comm[i])) gm.set(comm[i], []); gm.get(comm[i]).push(i); }
const hoods = [...gm.values()].filter(g => g.length >= 3).sort((a, b) => b.length - a.length);
const hoodOf = new Int32Array(N).fill(-1); hoods.forEach((g, h) => g.forEach(i => hoodOf[i] = h));
for (const i of bridge) { const c = new Map(); nb[i].forEach(j => hoodOf[j] >= 0 && c.set(hoodOf[j], (c.get(hoodOf[j]) || 0) + 1)); let best = -1, bv = 0; c.forEach((n, k) => { if (n > bv) { bv = n; best = k; } }); if (best >= 0) { hoodOf[i] = best; hoods[best].push(i); } }
bridge.clear();   // from here on they are just notes
const H = hoods.length;
const pairCount = new Map(); for (let k = 0; k < L; k++) { const a = hoodOf[la[k]], b = hoodOf[lb[k]]; if (a < 0 || b < 0 || a === b) continue; const key = Math.min(a, b) * H + Math.max(a, b); pairCount.set(key, (pairCount.get(key) || 0) + 1); }
const pairs = [...pairCount].map(([key, n]) => [Math.floor(key / H), key % H, n]);
const hoodR = hoods.map(g => .9 * Math.cbrt(g.length));
// ── the hierarchy: notes → clusters → clusters of clusters → … merged by their links until nothing more merges ──
const C = hoods.map(g => ({ level: 0, kids: null, notes: g, parent: -1 }));
let layer = hoods.map((_, k) => k), edges = pairs.map(([a, b, n]) => [a, b, n]);
for (let lev = 1; lev < 16 && layer.length > 5; lev++) {
  const idx = new Map(layer.map((c, k) => [c, k])), adj = layer.map(() => new Map());
  for (const [a, b, n] of edges) { const x = idx.get(a), y = idx.get(b); adj[x].set(y, (adj[x].get(y) || 0) + n); adj[y].set(x, (adj[y].get(x) || 0) + n); }
  const lab = layer.map((_, k) => k), ord = layer.map((_, k) => k);
  for (let it = 0; it < 20; it++) { ord.sort(() => Math.random() - .5); let moved = 0;
    for (const k of ord) { if (!adj[k].size) continue; const t = new Map(); adj[k].forEach((n, j) => t.set(lab[j], (t.get(lab[j]) || 0) + n));
      let best = lab[k], bv = -1; t.forEach((n, l) => { if (n > bv) { bv = n; best = l; } }); if (best !== lab[k]) { lab[k] = best; moved++; } }
    if (!moved) break; }
  const groups = new Map(); layer.forEach((c, k) => { if (!groups.has(lab[k])) groups.set(lab[k], []); groups.get(lab[k]).push(k); });
  if (groups.size > layer.length * .9) break;                    // nothing much merges any more: this is the top
  const up = new Map(), next = [];
  groups.forEach(ms => { if (ms.length === 1) { up.set(layer[ms[0]], layer[ms[0]]); next.push(layer[ms[0]]); return; }
    const id = C.length; C.push({ level: lev, kids: ms.map(k => layer[k]), notes: ms.flatMap(k => C[layer[k]].notes), parent: -1 });
    ms.forEach(k => { C[layer[k]].parent = id; up.set(layer[k], id); }); next.push(id); });
  const agg = new Map(); for (const [a, b, n] of edges) { const x = up.get(a), y = up.get(b); if (x === y) continue; const key = Math.min(x, y) + "," + Math.max(x, y); agg.set(key, (agg.get(key) || 0) + n); }
  edges = [...agg].map(([key, n]) => { const [x, y] = key.split(",").map(Number); return [x, y, n]; });
  layer = next;
}
let roots = layer; while (roots.length === 1 && C[roots[0]].kids) { const top = roots[0]; roots = C[top].kids; roots.forEach(k => C[k].parent = -1); }   // a single top cluster says nothing: start at its children
const CN = C.length;
// a cluster is named after its group note when it has one, else its most-linked subject; a day log never names one
const NAME_RANK = { group: 4, hub: 3, facet: 2, person: 1, project: 1 };   // a group's own note names its cluster before any member does
const namePick = ms => { const s = ms.filter(i => !isLog(nodes[i])), from = s.length ? s : ms, rank = i => (nodes[i].group ? 9 : NAME_RANK[nodes[i].type] || 0) * 1e6 + deg[i]; return from.reduce((a, b) => rank(b) > rank(a) ? b : a, from[0]); };
const cName = c => nodes[namePick(C[c].notes)].title;
const cR = C.map(c => .9 * Math.cbrt(c.notes.length) * (1 + c.level * .6));
const cCent = C.map(() => new THREE.Vector3());
console.log("levels:", Math.max(...C.map(c => c.level)) + 1, "clusters:", CN, "top:", roots.length);

const PALETTE = [0xd58bff, 0xff8fc8, 0x6ff0c8, 0x8fb4ff, 0xffc98f, 0xb69bff, 0x7fe0ff, 0xff9f9f, 0xc6ff8f, 0xf0a0ff];
const baseCol = nodes.map((n, i) => new THREE.Color(bridge.has(i) ? 0xffffff : hoodOf[i] < 0 ? 0x4a4866 : PALETTE[hoodOf[i] % PALETTE.length]));

// ── scene ──
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x05040c);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
const glowTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const r = g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.2,"rgba(255,255,255,.7)"); r.addColorStop(.5,"rgba(255,255,255,.12)"); r.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
// the backdrop is a skybox: it travels with the camera, so every direction has the same faint dust and glow
const sky = new THREE.Group(); scene.add(sky);
{ const g = new THREE.BufferGeometry(), p = new Float32Array(8000 * 3);
  for (let i = 0; i < p.length; i += 3) { const v = rndDir(new THREE.Vector3()).multiplyScalar(300 + Math.random() * 500); p.set([v.x, v.y, v.z], i); }
  g.setAttribute("position", new THREE.BufferAttribute(p, 3)); sky.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x5fb8c8, size: 1.4, transparent: true, opacity: .35 })));
  const tints = [0x123a5a, 0x2a1f6a, 0x0f4a5a, 0x1f1a50, 0x18305a];
  for (let k = 0; k < 14; k++) {   // spread evenly over the whole sphere (a golden-angle spiral), not bunched on one side
    const y = 1 - (k + .5) / 7, r = Math.sqrt(Math.max(0, 1 - y * y)), t = k * 2.39996;
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: tints[k % tints.length], transparent: true, opacity: .5, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.set(Math.cos(t) * r * 520, y * 520, Math.sin(t) * r * 520); const sc = 600 + (k * 137) % 300; m.scale.set(sc, sc, 1); sky.add(m); } }

const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3);
// start each neighbourhood in its own patch of space so settling is quick
const SPACE = Math.max(.22, Math.min(1, Math.cbrt(N / 20000)));   // the space a brain spreads into grows with it: a small brain is a smaller universe, not a sparse one
const hoodSeed = hoods.map(() => new THREE.Vector3((Math.random() - .5) * 220 * SPACE, (Math.random() - .5) * 110 * SPACE, (Math.random() - .5) * 160 * SPACE));
for (let i = 0; i < N; i++) { const c = hoodOf[i] >= 0 ? hoodSeed[hoodOf[i]] : new THREE.Vector3(); const v = rndDir(new THREE.Vector3()).multiplyScalar(hoodOf[i] >= 0 ? 4 : 120 * SPACE * Math.cbrt(Math.random()));   // a loose star lands anywhere in the space, evenly: unlinked ideas are scattered, never piled in the middle
  pos[i*3] = c.x + v.x; pos[i*3+1] = c.y + v.y; pos[i*3+2] = c.z + v.z; }

const dotGeo = new THREE.BufferGeometry(); dotGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
const colArr = new Float32Array(N * 3); dotGeo.setAttribute("color", new THREE.BufferAttribute(colArr, 3));
const dotTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d");
  const r = g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.3,"rgba(255,255,255,.95)"); r.addColorStop(.5,"rgba(255,255,255,.25)"); r.addColorStop(.75,"rgba(255,255,255,.04)"); r.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle = r; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
// each note's glow grows with its size (how long it is); hubs glow most
const sizeArr = new Float32Array(N); for (let i = 0; i < N; i++) sizeArr[i] = .2;
const crowd = new Float32Array(N);   // how many notes are packed close around each one: drives its size and brightness
dotGeo.setAttribute("size", new THREE.BufferAttribute(sizeArr, 1));
const dots = new THREE.Points(dotGeo, new THREE.ShaderMaterial({ uniforms: { map: { value: dotTex } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
  vertexShader: "attribute float size; varying vec3 vC; void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = clamp(size * 700.0 / -mv.z, 1.2, 40.0); gl_Position = projectionMatrix * mv; }",
  fragmentShader: "uniform sampler2D map; varying vec3 vC; void main(){ vec4 t = texture2D(map, gl_PointCoord); gl_FragColor = vec4(vC * t.rgb, t.a); }" }));
dots.frustumCulled = false; scene.add(dots);   // notes move after load, so the bounds three.js measured once are wrong: never cull them
const isHub = nodes.map((_, i) => !bridge.has(i) && deg[i] >= 6), hubIds = nodes.map((_, i) => i).filter(i => isHub[i]);
const hubPos = new Float32Array(hubIds.length * 3), hubGeo = new THREE.BufferGeometry(); hubGeo.setAttribute("position", new THREE.BufferAttribute(hubPos, 3));
const hubCol = new Float32Array(hubIds.length * 3); hubIds.forEach((i, k) => { const c = baseCol[i].clone().lerp(new THREE.Color(1, 1, 1), .65); hubCol.set([c.r, c.g, c.b], k * 3); }); hubGeo.setAttribute("color", new THREE.BufferAttribute(hubCol, 3));
const hubPts = new THREE.Points(hubGeo, new THREE.PointsMaterial({ map: glowTex, vertexColors: true, size: 4.5, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); // hubs now glow through their own size
// (no stardust: every dot in the space is a note)
// bridges get a bigger glow of their own
const bridgeSprites = [].map(i => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xf3eaff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.set(5, 5, 1); s.userData.i = i; scene.add(s); return s; });
const linePos = new Float32Array(L * 6), lineCol = new Float32Array(L * 6);
const lineGeo = new THREE.BufferGeometry(); lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3)); lineGeo.setAttribute("color", new THREE.BufferAttribute(lineCol, 3));
const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false })); lines.frustumCulled = false; scene.add(lines);

const flows = []; for (let k = 0; k < L; k++) if (hoodOf[la[k]] !== hoodOf[lb[k]] && hoodOf[la[k]] >= 0 && hoodOf[lb[k]] >= 0 && Math.random() < .5) flows.push({ k, t: Math.random(), s: .0008 + Math.random() * .0015 });
const flowPos = new Float32Array(flows.length * 3), flowGeo = new THREE.BufferGeometry(); flowGeo.setAttribute("position", new THREE.BufferAttribute(flowPos, 3));
const flowPts = (new THREE.Points(flowGeo, new THREE.PointsMaterial({ color: 0x9fe8ff, size: .35, transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false })));
// black holes only at the heart of truly dense neighbourhoods
const DENSE = Math.max(20, Math.min(150, Math.round(N * .08)));   // a neighbourhood holding this share of the brain gets a black hole: relative, so a small brain still has them
const PULSAR = Infinity, GIANT = Infinity;   // no rings or stars any more: only black holes
const SPIRAL = Math.max(6, Math.round(DENSE * .3));   // a neighbourhood this big, but short of a black hole, is a small spiral galaxy round a star
