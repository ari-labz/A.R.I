name: Docker image

# Builds the A·R·I server image for ARM64 (DGX Spark and other ARM NVIDIA machines) and AMD64 and publishes it to
# ghcr.io/ari-labz/ari. Runs on every release tag (tagged with the version and "latest"), or by hand from the Actions
# tab. It does not run on pushes to main.
#
# Each platform builds on a native runner (no emulation — compiling llama.cpp for CUDA under QEMU would take hours),
# pushes by digest, and a final job stitches the two into one multi-arch tag.

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ari-labz/ari

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Only SmartReader is needed to build; the voice-engine submodules are ~1 GB and stay out of the image.
      - run: git submodule update --init --depth 1 Submodules/SmartReader

      - id: meta
        run: |
          V="$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pair=${{ matrix.platform }}" | sed 's#/#-#' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ARI_VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.meta.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.pair }}

      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          V="$(python3 -c "import json;print(json.load(open('${GITHUB_WORKSPACE}/manifest.json'))['version'])")"
          # "latest" follows every release, including 0.x; pin a version tag to hold back.
          docker buildx imagetools create \
            -t "${IMAGE}:${V}" -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${V}"
