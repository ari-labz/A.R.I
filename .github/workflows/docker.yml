name: Docker image

# Builds the A·R·I server image for ARM64 (DGX Spark and other ARM NVIDIA machines) and publishes it to
# ghcr.io/ari-labz/ari. Runs on every push to main (tagged "latest"), on every release tag (tagged with the version and
# "latest"), or by hand from the Actions tab.
#
# Each platform builds on a native runner (no emulation — compiling llama.cpp for CUDA under QEMU would take hours),
# pushes by digest, and a final job stitches the two into one multi-arch tag.

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
    # Docs-only changes don't need an image build.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ari-labz/ari

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Only SmartReader is needed to build; the voice-engine submodules are ~1 GB and stay out of the image.
      - run: git submodule update --init --depth 1 Submodules/SmartReader

      - id: meta
        run: |
          V="$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "pair=${{ matrix.platform }}" | sed 's#/#-#' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ARI_VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.meta.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.pair }}

      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        working-directory: /tmp/digests
        run: |
          V="$(python3 -c "import json;print(json.load(open('${GITHUB_WORKSPACE}/manifest.json'))['version'])")"
          # "latest" is the newest build of main; a release tag also publishes its version number so it can be pinned.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="-t ${IMAGE}:${V} -t ${IMAGE}:latest"
          else
            TAGS="-t ${IMAGE}:latest"
          fi
          docker buildx imagetools create ${TAGS} $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:latest"
